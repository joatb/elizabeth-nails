<div
  class="schedule-grid"
  [style.grid-template-columns]="'64px repeat(' + columns.length + ', minmax(220px, 1fr))'"
>
  <div
    *ngFor="let slot of timeSlots; let rowIndex = index"
    class="hour-gutter-cell"
    [style.grid-column]="1"
    [style.grid-row]="rowIndex + 3"
  >
    {{ slot }}
  </div>

  <ng-container *ngFor="let column of columns; let colIndex = index">
    <div
      class="employee-column-header"
      [class.drag-over]="dragOverColumnKey === column.key"
      [style.grid-column]="colIndex + 2"
      [style.grid-row]="1"
      (dragover)="handleDragOver($event, column.key)"
      (dragleave)="handleDragLeave(column.key)"
      (drop)="handleDrop($event, column.employeeId)"
    >
      <span class="employee-color-dot" *ngIf="column.color" [style.background]="column.color"></span>
      <span class="employee-column-title">{{ column.name }}</span>
    </div>

    <div
      class="add-cita-cell"
      [class.drag-over]="dragOverColumnKey === column.key"
      [style.grid-column]="colIndex + 2"
      [style.grid-row]="2"
      (dragover)="handleDragOver($event, column.key)"
      (dragleave)="handleDragLeave(column.key)"
      (drop)="handleDrop($event, column.employeeId)"
    >
      <mol-add-event-button (action)="handleAdd(column.employeeId)"></mol-add-event-button>
    </div>

    <div
      *ngIf="!column.hasEvents"
      class="empty-column-cell"
      [class.drag-over]="dragOverColumnKey === column.key"
      [style.grid-column]="colIndex + 2"
      [style.grid-row]="'3 / span ' + timeSlots.length"
      (dragover)="handleDragOver($event, column.key)"
      (dragleave)="handleDragLeave(column.key)"
      (drop)="handleDrop($event, column.employeeId)"
    >
      No hay citas para este día.
    </div>

    <div
      *ngIf="column.hasEvents"
      class="schedule-track"
      [class.drag-over]="dragOverColumnKey === column.key"
      [style.grid-column]="colIndex + 2"
      [style.grid-row]="'3 / span ' + timeSlots.length"
      (dragover)="handleDragOver($event, column.key)"
      (dragleave)="handleDragLeave(column.key)"
      (drop)="handleDrop($event, column.employeeId)"
    >
      <div
        *ngFor="let event of column.events"
        class="event-slot"
        [class.event-slot--expanded]="expandedEventId === event.id"
        [style.top.%]="event.topPercent"
        [style.height.%]="event.heightPercent"
        [style.left]="'calc(' + event.leftPercent + '% + 2px)'"
        [style.width]="'calc(' + event.widthPercent + '% - 4px)'"
        [style.border-left-color]="event.service_color || 'var(--ion-color-primary)'"
        (click)="toggleExpanded(event.id)"
      >
        <mol-day-event-item
          [event]="event"
          [draggable]="true"
          [showTimelineDot]="false"
          [collapsible]="true"
          [expanded]="expandedEventId === event.id"
          (edit)="handleEdit($event)"
          (delete)="handleDelete($event)"
          (dragStart)="handleDragStart($event)"
        ></mol-day-event-item>
      </div>
    </div>
  </ng-container>
</div>
