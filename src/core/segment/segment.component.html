<div class="footer" [class.hidden]="!tabBarVisibility.visible()">
    <div class="footer-content">
        <div class="left">
            <div class="item" [class.active]="selectedSegment === 'calendar'" (click)="onChangeSegment('calendar')">
                <i-lucide [img]="CalendarDays"></i-lucide>
                <ion-label>Calendario</ion-label>
            </div>
            <div class="item" [class.active]="selectedSegment === 'clients'" (click)="onChangeSegment('clients')">
                <i-lucide [img]="UsersRound"></i-lucide>
                <ion-label>Clientes</ion-label>
            </div>
            <div class="item" [class.active]="selectedSegment === 'employees'" (click)="onChangeSegment('employees')">
                <i-lucide [img]="UserRound"></i-lucide>
                <ion-label>Empleados</ion-label>
            </div>
        </div>
        <div class="center">
            <ion-fab-button [disabled]="selectedSegment === 'chat'" (click)="add()">
                <ion-icon name="add-outline"></ion-icon>
            </ion-fab-button>
        </div>
        <div class="right">
            <div class="item" [class.active]="selectedSegment === 'services'" (click)="onChangeSegment('services')">
                <i-lucide [img]="DollarSign"></i-lucide>
                <ion-label>Servicios</ion-label>
            </div>
            <div class="item" [class.active]="selectedSegment === 'chat'" (click)="onChangeSegment('chat')">
                <i-lucide [img]="MessageCircle"></i-lucide>
                <ion-label>Chat</ion-label>
            </div>
            <div class="item" [id]="ajustesButtonId">
                <i-lucide [img]="Settings"></i-lucide>
                <ion-label>Ajustes</ion-label>
            </div>
        </div>
    </div>

    <ion-popover [trigger]="ajustesButtonId" dismissOnSelect="true">
        <ng-template>
            <ion-list>
                <ion-item button="true" (click)="openSchedule()">
                    <i-lucide [img]="Clock" slot="start"></i-lucide>
                    <ion-label>Horarios</ion-label>
                </ion-item>
                <ion-item button="true" (click)="openTheme()">
                    <i-lucide [img]="Palette" slot="start"></i-lucide>
                    <ion-label>Tema</ion-label>
                </ion-item>
            </ion-list>
        </ng-template>
    </ion-popover>
</div>
